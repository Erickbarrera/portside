# Release files checked against v0.70.1 on 2026-10-15.
# CorsixTH.app is signed with a Developer ID.
schema: 1
id: corsixth-corsixth
game_key: themehospital
status: playable
status_notes: "Needs the files from your own copy of Theme Hospital; CorsixTH asks for their folder on first run."
source:
  type: github_releases
  repo: CorsixTH/CorsixTH
  channel: stable
builds:
  - os: windows
    arch: x86_64
    asset: "CorsixTH-*-Windows-x64.zip"
    archive: zip
    launch: { exe: "CorsixTH.exe" }
  - os: macos
    arch: universal
    asset: "CorsixTH-*.dmg"
    archive: dmg
    launch: { app_bundle: "CorsixTH.app" }
  - os: linux
    arch: x86_64
    asset: "CorsixTH-*-x86_64.AppImage"
    archive: appimage
    launch: { exe: "CorsixTH.AppImage" }
multiplayer: none
changelog:
  - "2026-10-15: initial (Windows, macOS and Linux)"
