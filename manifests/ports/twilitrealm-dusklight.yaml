# Release files checked against v2.0.3 on 2026-10-14 (Linux on 2026-10-15).
schema: 1
id: twilitrealm-dusklight
game_key: thelegendofzeldatwilightprincess
status: playable
status_notes: "Needs a disc image of your own copy of Twilight Princess (GameCube)."
source:
