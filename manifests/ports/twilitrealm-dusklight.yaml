  repo: TwilitRealm/dusklight
  channel: stable
builds:
  - os: macos
    arch: arm64
    asset: "Dusklight-*-macos-arm64.zip"
    archive: zip
    launch: { app_bundle: "Dusklight.app" }
  - os: macos
    arch: x86_64
    asset: "Dusklight-*-macos-x86_64.zip"
    archive: zip
    launch: { app_bundle: "Dusklight.app" }
  - os: windows
    arch: x86_64
    asset: "Dusklight-*-win32-x86_64.zip"
    archive: zip
    launch: { exe: "dusklight.exe" }
  - os: linux
    arch: x86_64
    asset: "Dusklight-*-linux-x86_64.AppImage"
    archive: appimage
    launch: { exe: "Dusklight.AppImage" }
  - os: linux
    arch: arm64
    asset: "Dusklight-*-linux-arm64.AppImage"
    archive: appimage
    launch: { exe: "Dusklight.AppImage" }
multiplayer: none
links:
  homepage: "https://twilitrealm.dev"
changelog:
  - "2026-10-14: initial (macOS and Windows)"
