# Release files checked against v1.8.0 on 2026-10-15.
# julius.app is ad-hoc signed, not Developer ID.
# Android APK checked against v1.8.0 on 2026-10-18 (package from android/julius/build.gradle).
schema: 1
id: bvschaik-julius
game_key: caesariii
status: playable
status_notes: "Needs the files from your own copy of Caesar III; Julius asks for their folder on first run."
source:
  type: github_releases
  repo: bvschaik/julius
  channel: stable
builds:
  - os: windows
    arch: x86_64
    asset: "julius-*-windows.zip"
    archive: zip
    launch: { exe: "julius.exe" }
  - os: macos
    arch: universal
    asset: "julius-*-mac.dmg"
    archive: dmg
    launch: { app_bundle: "julius.app" }
    unsigned: true
  - os: linux
    arch: x86_64
    asset: "julius-*-linux.AppImage"
    archive: appimage
    launch: { exe: "julius.AppImage" }
  - os: android
    arch: universal
    asset: "julius-*-android.apk"
    archive: apk
    android_package: "com.github.bvschaik.julius"
multiplayer: none
changelog:
  - "2026-10-15: initial (Windows, macOS and Linux)"
  - "2026-10-18: Android (APK)"
