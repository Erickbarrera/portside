# Release files checked against continuous (isle 0.1) on 2026-10-15.
# Upstream publishes only a rolling `continuous` prerelease; the apps are ad-hoc signed, not Developer ID.
schema: 1
id: isledecomp-isle-portable
game_key: legoisland
status: playable
status_notes: "Needs the files from your own LEGO Island CD; Isle's configuration tool sets where they are. Builds come from the project's rolling development release."
source:
  type: github_releases
  repo: isledecomp/isle-portable
  channel: tag_pattern
  tag_pattern: "^continuous$"
builds:
  - os: windows
    arch: x86_64
    asset: "isle-*-Windows-x64.zip"
    archive: zip
    strip_root: true
    launch: { exe: "bin/isle.exe" }
  - os: macos
    arch: arm64
    asset: "isle-*-Darwin-arm64.dmg"
    archive: dmg
    launch: { app_bundle: "Isle Portable.app" }
    unsigned: true
  - os: macos
    arch: x86_64
    asset: "isle-*-Darwin-x64.dmg"
    archive: dmg
    launch: { app_bundle: "Isle Portable.app" }
    unsigned: true
  - os: linux
    arch: x86_64
    asset: "Isle_Portable-x86_64.AppImage"
    archive: appimage
    launch: { exe: "Isle_Portable-x86_64.AppImage" }
multiplayer: none
changelog:
  - "2026-10-15: initial (Windows, macOS and Linux)"
