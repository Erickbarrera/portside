# Release files checked against 1.0.0 on 2026-10-13 (Linux on 2026-10-15).
schema: 1
id: harbourmasters-spaghettikart
game_key: mariokart64
status: playable
status_notes: "Needs your own Mario Kart 64 ROM."
source:
  type: github_releases
  repo: HarbourMasters/SpaghettiKart
  channel: stable
builds:
  - os: macos
    arch: arm64
    asset: "spaghetti-mac-arm64.zip"
    archive: zip
    launch: { exe: "Spaghettify", chmod_x: true }
    unsigned: true
  - os: macos
    arch: x86_64
    asset: "spaghetti-mac-intel-x64.zip"
    archive: zip
    launch: { exe: "Spaghettify", chmod_x: true }
    unsigned: true
  - os: windows
    arch: x86_64
    asset: "spaghetti-windows.zip"
    archive: zip
    launch: { exe: "Spaghettify.exe" }
  - os: linux
    arch: x86_64
    asset: "spaghetti-linux.zip"
    archive: zip
    launch: { exe: "spaghetti.appimage", chmod_x: true }
links:
  homepage: "https://harbourmasters.github.io/SpaghettiKart/"
changelog:
  - "2026-10-13: initial (macOS and Windows)"
  - "2026-10-15: Linux"
