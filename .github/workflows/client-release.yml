name: client-release

# Builds the desktop app for macOS, Windows and Linux.
# - Tag `client-vX.Y.Z` (matching the app version): attaches the builds to a draft GitHub
#   release, then publishes it once every build succeeded. 0.x versions are published as
#   pre-releases (alpha). See client/docs/build-release.md.
# - Pull requests that touch this file, or a manual run: builds only, uploads the files as
#   workflow artifacts, creates no release.

on:
  push:
    tags: ["client-v*"]
  pull_request:
    paths: [".github/workflows/client-release.yml"]
  workflow_dispatch:

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          conf="$(jq -r .version client/src-tauri/tauri.conf.json)"
          cargo="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' client/Cargo.toml)"
          echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version. Bump client/src-tauri/tauri.conf.json and client/Cargo.toml first."
            exit 1
          fi
      - name: Create the draft release (or reuse it on a re-run)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Portside ${TAG#client-v}" \
              --notes-file .github/client-release-notes.md
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: release
    # Runs without the release job on pull requests and manual runs.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: ""
          # 22.04 keeps the AppImage/deb working on older glibc (Steam Deck included).
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      # Installs the version pinned in client/rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Extra Rust targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: release
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Bakes another default catalog address into the app (read by option_env! in
      # src-tauri/src/state.rs). Only exported when the repo variable is set: an empty value
      # would count as set. Unset, builds use the GitHub Pages catalog.
      - name: Default catalog address
        if: vars.PORTSIDE_DEFAULT_CATALOG_URL != ''
        env:
          URL: ${{ vars.PORTSIDE_DEFAULT_CATALOG_URL }}
        run: echo "PORTSIDE_DEFAULT_CATALOG_URL=$URL" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Empty on pull requests and manual runs: build only, no upload.
          releaseId: ${{ needs.release.outputs.id }}
      - name: Keep the build as a workflow artifact
        if: needs.release.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: portside-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            client/target/**/release/bundle/dmg/*.dmg
            client/target/**/release/bundle/msi/*.msi
            client/target/**/release/bundle/nsis/*.exe
            client/target/**/release/bundle/appimage/*.AppImage
            client/target/**/release/bundle/deb/*.deb
            client/target/**/release/bundle/rpm/*.rpm

  publish:
    name: publish release
    needs: [release, build]
    # Only when every platform built: a failed build leaves the draft for a re-run.
    if: startsWith(github.ref, 'refs/tags/client-v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#client-v}"
          prerelease=false
          case "$version" in 0.*|*-*) prerelease=true ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"
