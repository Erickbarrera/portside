name: catalog

# Checks the catalog builder, the manifests and the website; on main, rebuilds the static catalog
# once a day and deploys it, with the website, to this repository's GitHub Pages
# (docs/specs/static-catalog.md, docs/publishing.md).
on:
  pull_request:
    paths: ["catalog/**", "manifests/**", "web/**", "docs/specs/static-catalog/**", ".github/workflows/catalog.yml"]
  push:
    branches: [main]
    paths: ["catalog/**", "manifests/**", "web/**", "docs/specs/static-catalog/**", ".github/workflows/catalog.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: catalog

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: catalog/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: catalog/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - name: Generated files are current
        run: |
          pnpm schema:gen && pnpm contract:write
          git diff --exit-code schemas ../docs/specs/static-catalog

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          PORTSIDE_SITE_BASE: /portside

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: catalog-publish
      cancel-in-progress: false
    env:
      CATALOG_URL: ${{ vars.PORTSIDE_CATALOG_URL || 'https://erickbarrera.github.io/portside' }}
      # Where the catalog was published before it moved here; read once, by the first build.
      OLD_URL: https://erickbarrera.github.io/portside-catalog
      # Where the website lives: the same GitHub Pages site, under the repository's path.
      # For a custom domain set the SITE_URL variable to https://<domain> and SITE_BASE to /.
      PORTSIDE_SITE_URL: ${{ vars.SITE_URL || 'https://erickbarrera.github.io' }}
      PORTSIDE_SITE_BASE: ${{ vars.SITE_BASE || '/portside' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: catalog/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: catalog/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The builder keeps releases, covers and `rev` from the published catalog. Until the first
      # deploy here, that is the copy at the old address.
      - id: previous
        name: Find the published catalog
        run: |
          if curl -fsS -o /dev/null "$CATALOG_URL/v1/index.json"; then
            echo "url=$CATALOG_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$OLD_URL" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        name: Build the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CATALOG_PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        run: pnpm build --out ../_catalog
      # Daily runs publish only when the catalog changed; pushes to main (a website or builder
      # change) and manual runs always publish.
      - id: publish
        name: Decide whether to publish
        working-directory: .
        run: echo "go=${{ steps.build.outputs.changed == 'true' || github.event_name != 'schedule' }}" >> "$GITHUB_OUTPUT"
      # The website renders the catalog's first page from the files just built, served locally.
      - name: Build the website
        if: steps.publish.outputs.go == 'true'
        working-directory: web
        env:
          # Reads the app's latest release for the download button (public data; raises the
          # GitHub API rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          python3 -m http.server 8090 --directory ../_catalog >/dev/null 2>&1 &
          trap 'kill $!' EXIT
          sleep 1
          PORTSIDE_CATALOG_URL=http://localhost:8090 pnpm build
          mkdir -p ../_site
          cp -R ../_catalog/. ../_site/
          cp -R dist/. ../_site/
      - if: steps.publish.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # One name per attempt: a re-run would otherwise find two "github-pages" artifacts.
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        if: steps.publish.outputs.go == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

