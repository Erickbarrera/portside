name: client

on:
  # No path filter: the ruleset requires these checks on every PR.
  pull_request:
  push:
    branches: [main]
    paths: ["client/**", "docs/specs/static-catalog/**", ".github/workflows/client.yml"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libudev-dev
      # Installs the version pinned in client/rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated IPC bindings are committed
        run: git diff --exit-code ui/src/lib/ipc/bindings.ts

  # The Android build compiles (android.rs and the desktop-only code it leaves out). The APK
  # itself is built by client-release.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: android
      # The runner image has the Android NDK; its clang builds the C parts (SQLite, xz).
      - name: Clippy for Android
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --target aarch64-linux-android -p portside-desktop -- -D warnings

  # Disk images and quarantine handling only exist on macOS; Windows paths and process
  # handling differ too.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo test -p portside-installer -p portside-launcher -p portside-steam

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @portside/ui check
      - run: pnpm --filter @portside/ui test
      - run: pnpm --filter @portside/ui build
